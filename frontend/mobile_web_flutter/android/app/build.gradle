plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.mobile_web_flutter"

    // --- SỬA Ở ĐÂY ---
    // Thay flutter.compileSdkVersion bằng 35
    compileSdk = 35

    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.mobile_web_flutter"

        // --- SỬA Ở ĐÂY ---
        // Nên nâng minSdk lên ít nhất 23 để tránh lỗi tương thích các thư viện mới
        minSdk = 23

        // Thay flutter.targetSdkVersion bằng 35
        targetSdk = 35

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}