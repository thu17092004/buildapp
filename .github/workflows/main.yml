name: Build Android APK

on:
  push:
    branches: [ "truockhibuild" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Get Dependencies
        working-directory: ./frontend/mobile_web_flutter
        run: flutter pub get

      - name: Build APK (Main App)
        working-directory: ./frontend/mobile_web_flutter
        # Dưới đây là dòng quan trọng nhất đã được thêm -t lib/main_app.dart
        run: flutter build apk --release -t lib/main_app.dart --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend/mobile_web_flutter/build/app/outputs/flutter-apk/app-release.apk
